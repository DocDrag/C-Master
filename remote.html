<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>C Master - รีโมทครูผู้สอน</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --primary: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px;
      padding-bottom: 96px; /* Space for fixed bottom action bar */
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 10px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #94a3b8;
      transition: background 0.3s ease;
    }

    .status-dot.connected {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s infinite;
    }

    .status-dot.disconnected {
      background: var(--danger);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.15); }
    }

    .score-summary {
      display: flex;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .score-item.total { color: #60a5fa; }
    .score-item.correct { color: #34d399; }
    .score-item.incorrect { color: #f87171; }
    .score-item.skipped { color: #94a3b8; }

    /* Progress bar */
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      overflow: hidden;
      display: flex;
      margin-bottom: 12px;
    }

    .progress-fill-correct {
      background: var(--success);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-fill-incorrect {
      background: var(--danger);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-fill-skipped {
      background: #64748b;
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Settings Bar (Level + Focus) */
    .settings-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 12px;
      margin-bottom: 12px;
    }

    .select-pill {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      outline: none;
    }

    .focus-toggle-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .focus-toggle-wrap input {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    /* Code Display */
    .code-box {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.95rem;
      line-height: 1.5;
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px;
      color: #38bdf8;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .hint-box {
      margin-top: 8px;
      font-size: 0.82rem;
      color: #94a3b8;
    }

    /* Actions Card */
    .actions-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
    }

    .btn-action-tile {
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: all 0.15s ease;
    }

    .btn-action-tile:active {
      transform: scale(0.97);
    }

    .btn-reveal {
      background: linear-gradient(135deg, #d97706, #f59e0b);
      border: 1.5px solid rgba(251, 191, 36, 0.4);
    }

    .btn-reveal:active {
      background: #b45309;
    }

    .btn-check {
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      border: 1.5px solid rgba(96, 165, 250, 0.4);
    }

    .btn-check:active {
      background: #1e40af;
    }

    .btn-action-tile .tile-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action-tile .tile-sub {
      font-size: 0.78rem;
      font-weight: normal;
      opacity: 0.9;
    }

    /* Fixed Bottom Action Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--card-border);
      padding: 10px 14px;
      display: flex;
      gap: 10px;
      z-index: 100;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.4);
    }

    .action-btn {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: all 0.15s ease;
      min-height: 52px;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .btn-next-main {
      background: linear-gradient(135deg, #059669, #10b981);
      animation: pulseGlow 1.8s infinite;
    }

    .btn-restart-round {
      flex: 0 0 52px;
      background: #334155;
      color: #cbd5e1;
      border: 1px solid #475569;
      padding: 0;
      font-size: 1.1rem;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 12px rgba(16, 185, 129, 0.3); }
      50% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.6); }
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 200;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Top Bar: Live Status & Counters -->
  <div class="top-bar">
    <div class="status-badge">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">กำลังเชื่อมต่อ...</span>
    </div>
    <div class="score-summary">
      <span class="score-item total" id="score-total">ข้อ: 0</span>
      <span class="score-item correct" id="score-correct"><i class="fas fa-check"></i> 0</span>
      <span class="score-item incorrect" id="score-incorrect"><i class="fas fa-times"></i> 0</span>
      <span class="score-item skipped" id="score-skipped"><i class="fas fa-forward"></i> 0</span>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-bar-container">
    <div id="prog-correct" class="progress-fill-correct"></div>
    <div id="prog-incorrect" class="progress-fill-incorrect"></div>
    <div id="prog-skipped" class="progress-fill-skipped"></div>
  </div>

  <!-- Settings Bar (Level + Focus) -->
  <div class="settings-bar">
    <select id="remote-level-select" class="select-pill">
      <option value="1">ระดับ 1 (โครงสร้างพื้นฐานและแสดงผล)</option>
      <option value="2">ระดับ 2 (ตัวแปรและชนิดข้อมูล)</option>
      <option value="3">ระดับ 3 (รับค่าข้อมูล)</option>
      <option value="4">ระดับ 4 (คณิตศาสตร์)</option>
      <option value="5">ระดับ 5 (เงื่อนไขและตัดสินใจ)</option>
      <option value="6">ระดับ 6 (การวนซ้ำ)</option>
      <option value="7">ระดับ 7 (พอยน์เตอร์เบื้องต้น)</option>
      <option value="8">ระดับ 8 (ฟังก์ชัน)</option>
      <option value="9">ระดับ 9 (อาร์เรย์และสตริง)</option>
      <option value="10">ระดับ 10 (โครงสร้างข้อมูลและไฟล์)</option>
    </select>
    <label class="focus-toggle-wrap">
      <input type="checkbox" id="remote-focus-toggle">
      <span>โฟกัส</span>
    </label>
  </div>

  <!-- Card 1: Question Mirror on Projector -->
  <div class="card">
    <div class="card-header">
      <span id="question-card-title"><i class="fas fa-tv me-1"></i> จอคอมกำลังแสดงโจทย์</span>
      <span id="status-label" class="badge" style="font-size: 0.72rem; padding: 2px 6px; border-radius: 4px; background: #334155;">รอตอบ</span>
    </div>
    <div class="code-box" id="remote-code-preview">กำลังโหลดโจทย์...</div>
    <div class="hint-box" id="remote-hint"><i class="fas fa-lightbulb text-warning me-1"></i> กำลังรอข้อมูล...</div>
  </div>

  <!-- Card 2: Quick Action Controls -->
  <div class="card">
    <div class="card-header">
      <span><i class="fas fa-gamepad me-1"></i> สั่งการจอคอมพิวเตอร์</span>
    </div>
    <div class="actions-grid">
      <!-- Reveal Button: Puts answer onto web directly -->
      <button id="btn-reveal-action" class="btn-action-tile btn-reveal">
        <div class="tile-title">
          <i class="fas fa-lightbulb" style="font-size: 1.3rem;"></i>
          <span>เฉลยคำตอบ</span>
        </div>
        <div class="tile-sub">ใส่คำตอบลงบนเว็บทันที <i class="fas fa-arrow-right"></i></div>
      </button>

      <!-- Check Button: Checks current input on PC -->
      <button id="btn-check-action" class="btn-action-tile btn-check">
        <div class="tile-title">
          <i class="fas fa-check-circle" style="font-size: 1.3rem;"></i>
          <span>ตรวจคำตอบ</span>
        </div>
        <div class="tile-sub">ตรวจคำตอบที่พิมพ์ไว้ <i class="fas fa-arrow-right"></i></div>
      </button>
    </div>
  </div>

  <!-- Fixed Bottom Bar: Next / Reset -->
  <div class="bottom-bar">
    <button id="btn-next-action" class="action-btn btn-next-main">
      <i class="fas fa-forward"></i> ข้อถัดไป (Next Question)
    </button>
    <button id="btn-restart-game" class="action-btn btn-restart-round" title="เริ่มใหม่ (Reset Score)">
      <i class="fas fa-redo"></i>
    </button>
  </div>

  <div id="toast" class="toast">คำสั่งถูกส่งแล้ว</div>

  <script>
    let evtSource = null;
    let currentState = null;

    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const scoreTotal = document.getElementById("score-total");
    const scoreCorrect = document.getElementById("score-correct");
    const scoreIncorrect = document.getElementById("score-incorrect");
    const scoreSkipped = document.getElementById("score-skipped");
    const progCorrect = document.getElementById("prog-correct");
    const progIncorrect = document.getElementById("prog-incorrect");
    const progSkipped = document.getElementById("prog-skipped");

    const remoteLevelSelect = document.getElementById("remote-level-select");
    const remoteFocusToggle = document.getElementById("remote-focus-toggle");

    const statusLabel = document.getElementById("status-label");
    const remoteCodePreview = document.getElementById("remote-code-preview");
    const remoteHint = document.getElementById("remote-hint");

    const btnRevealAction = document.getElementById("btn-reveal-action");
    const btnCheckAction = document.getElementById("btn-check-action");
    const btnNextAction = document.getElementById("btn-next-action");
    const btnRestartGame = document.getElementById("btn-restart-game");

    const toast = document.getElementById("toast");

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1400);
    }

    function vibrate() {
      if ("vibrate" in navigator) {
        try { navigator.vibrate(35); } catch(e){}
      }
    }

    async function sendAction(action, target, value) {
      vibrate();
      try {
        await fetch("/api/action", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, target, value })
        });
      } catch (err) {
        console.error("Failed to send action:", err);
      }
    }

    function connectSSE() {
      if (evtSource) evtSource.close();

      statusDot.className = "status-dot";
      statusText.textContent = "กำลังเชื่อมต่อ...";

      evtSource = new EventSource("/api/events");

      evtSource.onopen = () => {
        statusDot.className = "status-dot connected";
        statusText.textContent = "เชื่อมต่อคอมแล้ว";
        sendAction("request_state");
      };

      evtSource.onerror = () => {
        statusDot.className = "status-dot disconnected";
        statusText.textContent = "ขาดการเชื่อมต่อ";
        evtSource.close();
        setTimeout(connectSSE, 3000);
      };

      evtSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if ((data.type === "state" || data.type === "init") && data.state) {
            updateUI(data.state);
          }
        } catch (err) {
          console.error("Error parsing SSE:", err);
        }
      };
    }

    async function fetchInitialState() {
      try {
        const res = await fetch("/api/state");
        if (res.ok) {
          const state = await res.json();
          if (state && Object.keys(state).length > 0) {
            updateUI(state);
          }
        }
      } catch (e) {}
    }

    function updateUI(state) {
      currentState = state;

      // Counters
      const correct = state.scoreCorrect || 0;
      const incorrect = state.scoreIncorrect || 0;
      const skipped = state.scoreSkipped || 0;
      const total = state.totalQuestions !== undefined ? state.totalQuestions : (correct + incorrect + skipped);

      scoreTotal.textContent = `ข้อ: ${total}`;
      scoreCorrect.innerHTML = `<i class="fas fa-check"></i> ${correct}`;
      scoreIncorrect.innerHTML = `<i class="fas fa-times"></i> ${incorrect}`;
      if (scoreSkipped) scoreSkipped.innerHTML = `<i class="fas fa-forward"></i> ${skipped}`;

      const totalCount = correct + incorrect + skipped;
      if (totalCount > 0) {
        progCorrect.style.width = (correct / totalCount * 100) + "%";
        progIncorrect.style.width = (incorrect / totalCount * 100) + "%";
        if (progSkipped) progSkipped.style.width = (skipped / totalCount * 100) + "%";
      } else {
        progCorrect.style.width = "0%";
        progIncorrect.style.width = "0%";
        if (progSkipped) progSkipped.style.width = "0%";
      }

      // Level & Focus
      if (remoteLevelSelect && state.level && remoteLevelSelect.value !== state.level) {
        remoteLevelSelect.value = state.level;
      }
      if (remoteFocusToggle && state.focus !== undefined) {
        remoteFocusToggle.checked = Boolean(state.focus);
      }

      // Code preview
      const qText = state.questionText || "(กำลังเตรียมโจทย์)";
      remoteCodePreview.textContent = qText;

      // Hint
      const hint = state.hint || "";
      remoteHint.innerHTML = hint ? `<i class="fas fa-lightbulb text-warning me-1"></i> คำใบ้: ${hint}` : "";

      // Status
      const status = state.status || "unattempted";
      if (status === "correct") {
        statusLabel.style.background = "#10b981";
        statusLabel.textContent = "เฉลย/ตอบถูก ✅";
      } else if (status === "wrong") {
        statusLabel.style.background = "#ef4444";
        statusLabel.textContent = "ตอบผิด ❌";
      } else {
        statusLabel.style.background = "#334155";
        statusLabel.textContent = "รอตอบ...";
      }
    }

    // Reveal Button -> Puts answer directly into the website input!
    btnRevealAction.addEventListener("click", () => {
      sendAction("click", "reveal-btn");
      showToast("ใส่คำตอบลงบนเว็บแล้ว");
    });

    // Check Button -> Checks the answer on the website
    btnCheckAction.addEventListener("click", () => {
      sendAction("click", "check-btn");
      showToast("ตรวจคำตอบแล้ว");
    });

    // Next Question Button
    btnNextAction.addEventListener("click", () => {
      sendAction("click", "next-btn");
      showToast("สุ่มข้อถัดไปแล้ว");
    });

    // Restart game
    btnRestartGame.addEventListener("click", () => {
      if (confirm("ต้องการเริ่มใหม่และรีเซ็ตคะแนนใช่หรือไม่?")) {
        sendAction("click", "restart_game");
        showToast("รีเซ็ตคะแนนแล้ว");
      }
    });

    // Level change
    remoteLevelSelect.addEventListener("change", (e) => {
      sendAction("set_level", null, e.target.value);
      showToast("เปลี่ยนระดับ: " + e.target.value);
    });

    // Focus toggle
    remoteFocusToggle.addEventListener("change", () => {
      sendAction("toggle_focus");
      showToast("สลับโฟกัสระดับ");
    });

    // Screen WakeLock
    let wakeLock = null;
    async function requestWakeLock() {
      if ("wakeLock" in navigator) {
        try { wakeLock = await navigator.wakeLock.request("screen"); } catch(e){}
      }
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") requestWakeLock();
    });
    window.addEventListener("click", () => {
      if (!wakeLock) requestWakeLock();
    }, { once: true });

    // Initial setup
    fetchInitialState();
    connectSSE();
  </script>
</body>
</html>
