<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C Language Syntax Training</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="container mt-3">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h1 class="text-center mb-4" id="game-title">🔥 ฝึกเติม code ภาษา C 🔥</h1>

                <div class="card">
                    <div class="card-header">
                        <div class="container text-center">
                            <div class="row">
                                <div class="col counter">
                                    <span id="score-correct">Correct: <span id="count-correct">0</span></span>
                                </div>
                                <div class="col counter">
                                    <span id="score-incorrect">Incorrect: <span id="count-incorrect">0</span></span>
                                </div>
                                <div class="col counter">
                                    <span id="score-skipped">Skipped: <span id="count-skipped">0</span></span>
                                </div>
                            </div>
                        </div>
                        <div class="progress mt-2" style="height: 10px;">
                            <div id="bar-correct" class="progress-bar bg-success" role="progressbar" style="width: 0%;"></div>
                            <div id="bar-incorrect" class="progress-bar bg-danger" role="progressbar" style="width: 0%;"></div>
                            <div id="bar-skipped" class="progress-bar bg-secondary" role="progressbar" style="width: 0%;"></div>
                        </div>
                    </div>
                    
                    <div class="card-body">
                        <div class="row mb-3 align-items-center">
                            <div class="col-md-8">
                                <label for="level-select" class="form-label fw-bold">เลือกระดับ:</label>
                                <select id="level-select" class="form-select" onchange="changeLevel()">
                                    <option value="1" selected>ระดับ 1 (โครงสร้างพื้นฐานและแสดงผล)</option>
                                    <option value="2">ระดับ 2 (ตัวแปรและชนิดข้อมูล)</option>
                                    <option value="3">ระดับ 3 (รับค่าข้อมูล)</option>
                                    <option value="4">ระดับ 4 (คณิตศาสตร์)</option>
                                    <option value="5">ระดับ 5 (เงื่อนไขและตัดสินใจ)</option>
                                    <option value="6">ระดับ 6 (การวนซ้ำ)</option>
                                    <option value="7">ระดับ 7 (พอยน์เตอร์เบื้องต้น)</option>
                                    <option value="8">ระดับ 8 (ฟังก์ชัน)</option>
                                    <option value="9">ระดับ 9 (อาร์เรย์และสตริง)</option>
                                    <option value="10">ระดับ 10 (โครงสร้างข้อมูลและไฟล์)</option>
                                </select>
                            </div>
                            <div class="col-md-4 mt-3 mt-md-0 d-flex align-items-center" id="focus-switch-container">
                                <label class="switch me-2">
                                  <input type="checkbox" id="focus-toggle" onchange="changeLevel()">
                                  <span class="slider round"></span>
                                </label>
                                <span class="text-muted small">โฟกัสเฉพาะระดับนี้</span>
                            </div>
                        </div>

                        <pre id="code-display" class="alert alert-info"></pre>
                        
                        <div id="feedback" class="text-center mt-2 mb-3" style="min-height: 48px;"></div>
                        
                        <div class="text-center mt-4">
                            <button id="main-action-btn" class="container-fluid btn btn-primary btn-lg" onclick="handleMainAction()">
                                <i class="fas fa-check"></i> ตรวจคำตอบ
                            </button>
                            <button class="btn btn-link text-muted mt-2 text-decoration-none" onclick="restartGame()">
                                <i class="fas fa-redo"></i> เริ่มใหม่ (Reset Score)
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <br>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
